name: Auto Update IPTV M3U

on:
  schedule:
    - cron: '0 * * * *' # Chạy tự động mỗi giờ 1 lần
  workflow_dispatch: # Cho phép nhấn nút chạy thủ công

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cấp quyền ghi nội dung vào repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pytz

      - name: Run Python script
        run: python update_playlist.py # Thay bằng tên file python của anh nếu khác

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || (git commit -m "Auto update playlist M3U" && git push)
          
