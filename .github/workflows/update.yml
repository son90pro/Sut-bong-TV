name: Auto Update IPTV M3U

on:
  schedule:
    - cron: '0 */2 * * *' # Tự động chạy lại mỗi 2 giờ
  workflow_dispatch: # Cho phép chạy thủ công bất cứ lúc nào trên web GitHub

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pytz

      - name: Run crawler script
        run: python update_playlist.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update IPTV playlist [skip ci]" && git push)
          
