name: Auto Update Sutbong M3U

on:
  schedule:
    - cron: '0 * * * *' # Chạy mỗi giờ 1 lần
  workflow_dispatch: # Cho phép chạy thủ công

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run script to generate M3U
      run: python generate_m3u.py

    - name: Commit and push if changes are detected
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add playlist.m3u
        git commit -m "Auto-update M3U playlist [skip ci]" || exit 0
        git push
        
